# 冒烟：端 Qwen3-VL-8B → 边 Qwen3-VL-8B（端侧升级到 8B）
#
# 与主线（端 4B → 边 8B，results/channel_main_4b8b_fair）的唯一变量是发射端报告质量：
# 接收端、过滤集、信道、协议、预算模式、权重全部一致，可直接对比。
#
# 注意：
#   1) run_channel_experiment.py 只加载接收端；发射端文本来自 score_cache，因此 8B 权重只实例化一份。
#   2) 本冒烟用的 score_cache 建于评分目标修正之前，属"真值目标"分支（离线上界）；
#      修正后的"自预测目标"分支需重建缓存（下一步）。
#   3) 端 8B = 边 8B 不满足"端 < 边"，仅作端侧算力上界探测，不进主线。
dataset:
  name: v2xqa
  split: test
  manifest: data/manifests/v2xqa_test_filtered_8b.jsonl
  processed: data/processed/v2xqa_test.jsonl
  require_image: true

score_cache: outputs/cache/v2xqa_scores_8b_pred_cpl.jsonl
benchmark_score_cache: outputs/cache/v2xqa_scores_8b_surprisal.jsonl
answer_score_cache: outputs/cache/v2xqa_scores_8b_answer_aware.jsonl

model:
  config: configs/models/qwen3_primary.yaml
  transmitter_path: models/Qwen3-VL-8B-Instruct
  receiver_path: models/Qwen3-VL-8B-Instruct
  receiver_load_in_8bit: false
  image_min_pixels: 25088
  image_max_pixels: 200704

transmitter:
  max_new_tokens: 320
  max_prompt_tokens: 320

receiver:
  max_new_tokens: 24

selection:
  methods: [full, adaptive_sc, proposed]
  retention_ratios: [0.3, 0.5, 0.7, 1.0]
  protection:
    mode: uniform
    levels: [48, 32, 16]
    uniform_symbols_per_token: 1.0

pragmatic:
  weights: [0.25, 0.30, 0.45]
  lambda_attention: 0.25
  lambda_semantic: 0.30
  lambda_gradient: 0.45
  beta: 0.25
  layer_reduction: mean
  coupling_enabled: true      # cache built with the E. (16) coupling matrix
  mask_token: "<|endoftext|>"

radio:
  bandwidth: 1000000.0
  slot_duration: 0.001
  epsilon_out: 0.05
  protection:
    levels: [48, 32, 16]
    information_bits_per_token: 16.0

scheduling:
  t_max: 8
  refine: true
  coupling_model: "joint"

channels:
  - configs/channels/rayleigh.yaml
  - configs/channels/rician.yaml
  - configs/channels/frequency_selective.yaml

snr_db: [0, 15]

methods:
  - full
  - adaptive_sc
  - proposed

experiment:
  channel_seeds: [0, 1, 2]
  proposed_budget: "conservative"
  channel_seed: 0
  num_samples: 60
  dataset_seed: 2026
  model_seed: 2026
  cuda_visible_devices: "0"
  single_gpu_only: true
