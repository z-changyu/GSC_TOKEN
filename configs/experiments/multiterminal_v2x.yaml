# 边缘-边缘 V2X-QA 实验配置（接收端升级为 Qwen3-VL-8B，作纯文本接收端）
#
# 与 v2x_edge_edge_8b.yaml 的唯一差异：
#   - model.receiver_path  -> models/Qwen3-VL-8B-Instruct  （验证"接收端容量" ablation）
# 发送端仍为 Qwen3-VL-8B，score_cache 仍为 outputs/cache/v2xqa_scores_8b.jsonl，
# 信道/方法/权重/过滤集逻辑完全一致，以便与 4B 接收端结果做受控对比。
dataset:
  name: v2xqa
  split: test
  manifest: data/manifests/v2xqa_test_filtered_8b.jsonl
  processed: data/processed/v2xqa_test.jsonl
  require_image: true

score_cache: outputs/cache/v2xqa_scores_8b_pred_cpl.jsonl

model:
  config: configs/models/qwen3_primary.yaml
  transmitter_path: models/Qwen3-VL-8B-Instruct
  receiver_path: models/Qwen3-VL-8B-Instruct
  receiver_load_in_8bit: false
  image_min_pixels: 25088      # 28*28*32  -> about 24 visual tokens
  image_max_pixels: 200704     # 28*28*256 -> about 196 visual tokens

transmitter:
  max_new_tokens: 192
  max_prompt_tokens: 192
receiver:
  max_new_tokens: 24

selection:
  methods: [full, random, proposed]
  retention_ratios: [0.3, 0.5, 0.7, 1.0]
  protection:
    mode: uniform
    levels: [48, 32, 16]       # r_H / r_M / r_L, equivalent bits per token
    uniform_symbols_per_token: 1.0

pragmatic:
  lambda_attention: 0.25
  lambda_semantic: 0.30
  lambda_gradient: 0.45
  beta: 0.13
  layer_reduction: mean
  coupling_enabled: true       # VI-B-5 uses the coupled objective
  mask_token: "<|endoftext|>"

radio:
  bandwidth: 1000000.0         # B, Hz
  slot_duration: 0.001         # T_s, s
  epsilon_out: 0.05
  protection:
    levels: [48, 32, 16]
    information_bits_per_token: 16.0

scheduling:
  t_max: 8
  refine: true

channels:
  # run_multiterminal.py only uses channels[0]; rayleigh is the primary channel.
  - configs/channels/rayleigh.yaml
  - configs/channels/ideal.yaml
  - configs/channels/rician.yaml
  - configs/channels/frequency_selective.yaml

snr_db: [0, 15]

methods:
  - full              # whole prompt at strongest level, budget ignored (upper reference)
  - random            # random tokens at strongest level, budget respected
  - fixed_H           # utility-greedy at strongest level only
  - proposed          # Algorithm 1: Lagrangian + certified rounding + local refinement
  - plugin_capacity   # internal baseline: Eq. (6) replaced by plug-in capacity

experiment:
  channel_seeds: [0]
  channel_seed: 0
  num_samples: 150
  dataset_seed: 2026
  model_seed: 2026
  cuda_visible_devices: "0"
  single_gpu_only: true
