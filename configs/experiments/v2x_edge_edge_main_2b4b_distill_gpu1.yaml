# 实验 B 评估配置：端 2B（蒸馏后）→ 边 4B
#
# 对照设计（只改一个变量）：
#   - 基线：端 2B 原始  → 边 4B（主线，proposed 51.9% / full 60.0%）
#   - 本配置：端 2B 蒸馏 → 边 4B（**同一接收端**，因此差异全部来自报告质量）
#   - 上界：端 8B        → 边 4B（proposed 70.4% / full 86.1%）
#
# transmitter 指向 LoRA 合并导出的独立学生权重（scripts/train_terminal_lora.py
# 的 --merged-dir），下游驱动无需任何代码改动。
#
# 注意：报告变了，三份缓存必须用学生模型重建（脚本会因长度校验拒绝复用）。
dataset:
  name: v2xqa
  split: test
  manifest: data/manifests/v2xqa_test_filtered_8b.jsonl
  processed: data/processed/v2xqa_test.jsonl
  require_image: true

score_cache: outputs/cache/v2xqa_scores_2b_distill.jsonl
benchmark_score_cache: outputs/cache/v2xqa_scores_2b_distill_surprisal.jsonl
answer_score_cache: outputs/cache/v2xqa_scores_2b_distill_answer_aware.jsonl

model:
  config: configs/models/qwen3_primary.yaml
  transmitter_path: models/Qwen3-VL-2B-Distilled   # 端：蒸馏后的 2B 车端模型
  receiver_path: models/Qwen3-4B                   # 边：与主线完全相同的 4B 协调器
  image_min_pixels: 25088
  image_max_pixels: 200704

transmitter:
  max_new_tokens: 320
  max_prompt_tokens: 320

receiver:
  max_new_tokens: 24

selection:
  methods: [full, random, proposed]
  retention_ratios: [0.3, 0.5, 0.7, 1.0]
  protection:
    mode: uniform
    levels: [48, 32, 16]
    uniform_symbols_per_token: 1.0

pragmatic:
  lambda_attention: 0.25
  lambda_semantic: 0.30
  lambda_gradient: 0.45
  beta: 0.25
  layer_reduction: mean
  coupling_enabled: false
  mask_token: "<|endoftext|>"

radio:
  bandwidth: 1000000.0
  slot_duration: 0.001
  epsilon_out: 0.05
  protection:
    levels: [48, 32, 16]
    information_bits_per_token: 16.0

scheduling:
  t_max: 8
  refine: true

channels:
  - configs/channels/rayleigh.yaml
  - configs/channels/rician.yaml
  - configs/channels/frequency_selective.yaml

snr_db: [0, 15]

methods:
  - full
  - adaptive_sc
  - answer_loo
  - answer_loo_uep
  - answer_attn
  - tokcom_uep
  - llmlingua2
  - efpc
  - tokcom
  - llmlingua
  - longllmlingua
  - selective_context
  - plugin_capacity
  - proposed

experiment:
  channel_seeds: [0, 1, 2]
  proposed_budget: "conservative"
  channel_seed: 0
  num_samples: 150
  dataset_seed: 2026
  model_seed: 2026
  cuda_visible_devices: "1"
  single_gpu_only: true
