# 模型轴（端侧 × 边侧能力）：端 2B → 1.7B 车机/弱边
#
# 与主线配置 v2x_edge_edge_main_2b4b.yaml 的唯一差异：
#   - receiver_path           -> models/Qwen3-1.7B（接收端能力下降）
#   - answer_score_cache      -> 1.7B 专用 sidecar
#     ★ answer-aware 打分是用「接收端模型」算的（scripts/build_answer_aware_scores.py），
#       换了接收端就必须重建，否则任务感知基线的打分来自错误的消费者：
#       python scripts/build_answer_aware_scores.py \
#           --config configs/experiments/v2x_edge_edge_main_2b17b.yaml \
#           --output outputs/cache/v2xqa_scores_2b_answer_aware_17b.jsonl
#   - cuda_visible_devices    -> "1"（与 GPU0 的主表链并行）
# 语用缓存与 surprisal sidecar 只依赖发送端，故与主线共用。
dataset:
  name: v2xqa
  split: test
  manifest: data/manifests/v2xqa_test_filtered_8b.jsonl
  processed: data/processed/v2xqa_test.jsonl
  require_image: true

score_cache: outputs/cache/v2xqa_scores_2b.jsonl
benchmark_score_cache: outputs/cache/v2xqa_scores_2b_surprisal.jsonl
answer_score_cache: outputs/cache/v2xqa_scores_2b_answer_aware_17b.jsonl

model:
  config: configs/models/qwen3_primary.yaml
  transmitter_path: models/Qwen3-VL-2B-Instruct   # 端：车端小 VLM
  receiver_path: models/Qwen3-1.7B                # 弱接收端（车机 / 弱边）
  image_min_pixels: 25088
  image_max_pixels: 200704

transmitter:
  max_new_tokens: 320
  max_prompt_tokens: 320

receiver:
  max_new_tokens: 24

selection:
  methods: [full, random, proposed]
  retention_ratios: [0.3, 0.5, 0.7, 1.0]
  protection:
    mode: uniform
    levels: [48, 32, 16]
    uniform_symbols_per_token: 1.0

pragmatic:
  lambda_attention: 0.25
  lambda_semantic: 0.30
  lambda_gradient: 0.45
  beta: 0.25
  layer_reduction: mean
  coupling_enabled: false
  mask_token: "<|endoftext|>"

radio:
  bandwidth: 1000000.0
  slot_duration: 0.001
  epsilon_out: 0.05
  protection:
    levels: [48, 32, 16]
    information_bits_per_token: 16.0

scheduling:
  t_max: 8
  refine: true

channels:
  - configs/channels/rayleigh.yaml
  - configs/channels/rician.yaml
  - configs/channels/frequency_selective.yaml

snr_db: [0, 15]

# 模型轴只需关键方法（与旧模型轴口径一致，控制时长）
methods:
  - full
  - plugin_capacity
  - proposed
  - adaptive_sc

experiment:
  channel_seeds: [0, 1, 2]
  proposed_budget: "conservative"
  channel_seed: 0
  num_samples: 150
  dataset_seed: 2026
  model_seed: 2026
  cuda_visible_devices: "1"
  single_gpu_only: true
